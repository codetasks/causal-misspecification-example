<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-factor causal misspecification — interactive widget</title>
<style>
  :root {
    --bg: #ffffff; --text: #1f1f1f; --head: #000000; --muted: #5f6368;
    --border: #e8eaed; --accent: #1a73e8; --accent-hover: #174ea6;
    --red: #ea4335; --yellow: #fbbc04; --green: #34a853;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Google Sans","Google Sans Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size: 16px; line-height: 1.6; margin: 0; padding: 40px 16px;
  }
  code {
    font-family: "Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size: 14px; background: #f8f9fa; border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px;
  }
  .sim {
    border: 1px solid var(--border); border-radius: 4px; padding: 20px 24px;
    margin: 0 auto; width: min(94vw, 960px);
  }
  .sim-controls {
    display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center;
    margin-bottom: 16px; font-size: 13px; color: var(--muted);
  }
  .sim-controls label { display: flex; align-items: center; gap: 8px; }
  .sim-controls input[type=range] { width: 96px; accent-color: var(--accent); }
  .sim-controls .val {
    font-family: "Roboto Mono",ui-monospace,monospace; color: var(--text);
    min-width: 38px; text-align: right;
  }
  .sim-controls label.ctrl { font-weight: 600; color: var(--accent); flex-basis: 100%; }
  .sim-stage { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
  .sim-stage .scatter-wrap { flex: 1 1 420px; min-width: 0; }
  .sim-stage .dag-wrap { flex: 0 0 300px; }
  #tf-bars { width: 100%; max-width: 100%; height: auto; display: block; }
  #tf-dag {
    width: 100%; max-width: 300px; height: auto; display: block;
    border: 1px solid var(--border); border-radius: 4px; background: #fff;
  }
  .dag-title {
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .4px; margin: 0 0 6px;
  }
  .dag-caption { font-size: 12.5px; color: var(--text); margin-top: 10px; line-height: 1.45; }
  .sim-readout {
    margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px;
  }
  .sim-readout b { font-family: "Roboto Mono",ui-monospace,monospace; }
  .sim-legend { display: inline-flex; align-items: center; gap: 7px; }
  .sim-legend .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .sim-lesson { margin-top: 10px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .eqs { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .eqrow { display: flex; flex-direction: column; gap: 3px; }
  .eqlab {
    font-size: 11px; font-weight: 600; letter-spacing: .3px;
    text-transform: uppercase; color: var(--muted);
  }
  .eqs code {
    display: block; background: #f8f9fa; border: 1px solid var(--border);
    border-radius: 4px; padding: 8px 11px; font-size: 13px; line-height: 1.5;
    white-space: normal;
  }
</style>
</head>
<body>

<div class="sim">
  <div class="sim-controls">
    <label class="ctrl">F&#x2081; plays the role of:</label>
    <label><input type="radio" name="tf-case" value="conf" checked> confounder (F&#x2081;&rarr;F&#x2082;, F&#x2081;&rarr;X)</label>
    <label><input type="radio" name="tf-case" value="coll"> collider (F&#x2082;&rarr;F&#x2081;, X&rarr;F&#x2081;)</label>
    <label class="ctrl"><input type="checkbox" id="p-ctl"> include F&#x2081; as a control in the regression</label>
    <label>&#946; (F&#x2082;&rarr;X, true) <input type="range" id="p-b" min="0" max="2" step="0.05" value="1"><span class="val" id="p-b-v">1.00</span></label>
    <label>a (F&#x2081; &harr; F&#x2082; strength) <input type="range" id="p-a" min="0" max="1.5" step="0.05" value="0.8"><span class="val" id="p-a-v">0.80</span></label>
    <label>c (F&#x2081; &harr; X strength) <input type="range" id="p-c" min="-1" max="1.5" step="0.05" value="0.7"><span class="val" id="p-c-v">0.70</span></label>
  </div>
  <div class="sim-stage">
    <div class="scatter-wrap">
      <canvas id="tf-bars" width="460" height="300"
        role="img" aria-label="Bars: true effect (green) vs OLS estimate of factor 2 (blue)"></canvas>
    </div>
    <div class="dag-wrap">
      <div class="dag-title">Structure (live)</div>
      <canvas id="tf-dag" width="300" height="240"
        role="img" aria-label="Live DAG of F1 as confounder or collider of the F2 to X relationship"></canvas>
      <div class="dag-caption" id="tf-cap"></div>
    </div>
  </div>
  <div class="sim-readout">
    <span class="sim-legend"><span class="dot" style="background:#34a853"></span>true effect &#946;: <b id="tf-true">--</b></span>
    <span class="sim-legend"><span class="dot" style="background:#1a73e8"></span>OLS estimate of F&#x2082;: <b id="tf-est">--</b></span>
    <span>bias: <b id="tf-bias" style="color:#ea4335">--</b></span>
    <span>verdict: <b id="tf-verdict">--</b></span>
  </div>
  <p class="sim-lesson" id="tf-lesson"></p>
  <div class="eqs" id="tf-eqs"></div>
</div>

<script>
(function () {
  var bars = document.getElementById('tf-bars');
  if (!bars || !bars.getContext) return;
  var bctx = bars.getContext('2d');
  var dg = document.getElementById('tf-dag');
  var dctx = (dg && dg.getContext) ? dg.getContext('2d') : null;
  function val(id) { return parseFloat(document.getElementById(id).value); }
  function setT(id, t) { var e = document.getElementById(id); if (e) e.textContent = t; }
  function ctl() { return document.getElementById('p-ctl').checked; }
  function caseSel() { return document.querySelector('input[name="tf-case"]:checked').value; }

  // Population-limit OLS coefficient on F2. All noises have unit variance.
  // Confounder: F1=eta1, F2=a*F1+eta2, X=b*F2+c*F1+eps
  //   plim omit F1  = b + a*c/(a^2+1)
  //   plim incl F1  = b  (exact)
  // Collider: F2=eta2, X=b*F2+eps, F1=a*F2+c*X+eta1
  //   plim omit F1  = b  (F2 exogenous, no backdoor)
  //   plim incl F1  = (b - a*c)/(c^2+1)  [SymPy-verified exact closed form]
  function estimate(cse, control, b, a, c) {
    if (cse === 'conf') {
      return control ? b : b + a * c / (a * a + 1);
    }
    if (!control) return b;
    return (b - a * c) / (c * c + 1);
  }

  function compute() {
    var b = val('p-b'), a = val('p-a'), c = val('p-c');
    var cse = caseSel(), control = ctl();
    var est = estimate(cse, control, b, a, c);
    return { b: b, a: a, c: c, cse: cse, control: control, est: est,
             bias: est - b, correct: Math.abs(est - b) < 1e-9 };
  }

  function lesson(c) {
    if (c.cse === 'conf') {
      return c.control
        ? 'F₁ is a confounder and you controlled for it. The backdoor F₂ ← F₁ → X is closed, so the estimate lands on the true effect.'
        : 'F₁ is a confounder left out of the regression. The open backdoor F₂ ← F₁ → X biases the estimate by a·c/(a²+1). You must control for it.';
    }
    return c.control
      ? 'F₁ is a collider and you controlled for it. Conditioning on a common effect of F₂ and X opens the spurious path F₂ → F₁ ← X and biases the estimate. You must NOT control for it.'
      : 'F₁ is a collider left out of the regression. The path F₂ → F₁ ← X is closed at the collider, so the estimate is the true effect.';
  }

  function renderEqs(c) {
    var el = document.getElementById('tf-eqs'); if (!el) return;
    var b = c.b.toFixed(2), a = c.a.toFixed(2), cc = c.c.toFixed(2), est = c.est.toFixed(3);
    var bs = (c.bias >= 0 ? '+' : '') + c.bias.toFixed(3);
    var doeq = 'E[X | do(F₂=f)] = β·f = ' + b + '·f';
    var scm, obsLab, obs, col;
    if (c.cse === 'conf') {
      scm = 'F₁ = η₁   ;   F₂ = ' + a + '·F₁ + η₂   ;   X = ' + b + '·F₂ + ' + cc + '·F₁ + ε';
      if (c.control) {
        obsLab = 'Observational, F₁ in the model (correctly specified)';
        obs = 'E[X | F₂=f, F₁] = ' + b + '·f + ' + cc + '·F₁   →   slope on F₂ = ' + b + ' = β';
        col = '#34a853';
      } else {
        obsLab = 'Observational, F₁ omitted (misspecified)';
        obs = 'E[X | F₂=f] = (β + a·c/(a²+1))·f = ' + est + '·f   →   slope on F₂ biased by ' + bs;
        col = '#ea4335';
      }
    } else {
      scm = 'F₂ = η₂   ;   X = ' + b + '·F₂ + ε   ;   F₁ = ' + a + '·F₂ + ' + cc + '·X + η₁';
      if (c.control) {
        obsLab = 'Observational, F₁ in the model (misspecified: conditions on a collider)';
        obs = 'E[X | F₂=f, F₁]   →   slope on F₂ = ' + est + '   →   biased by ' + bs;
        col = '#ea4335';
      } else {
        obsLab = 'Observational, F₁ omitted (correctly specified)';
        obs = 'E[X | F₂=f] = ' + b + '·f   →   slope on F₂ = ' + b + ' = β';
        col = '#34a853';
      }
    }
    el.innerHTML =
      '<div class="eqrow"><span class="eqlab">Structural causal model</span><code>' + scm + '</code></div>' +
      '<div class="eqrow"><span class="eqlab">Causal target (do-calculus)</span><code>' + doeq + '</code></div>' +
      '<div class="eqrow"><span class="eqlab" style="color:' + col + '">' + obsLab + '</span>' +
      '<code style="border-color:' + col + '">' + obs + '</code></div>';
  }

  function draw() {
    setT('p-b-v', val('p-b').toFixed(2));
    setT('p-a-v', val('p-a').toFixed(2));
    setT('p-c-v', val('p-c').toFixed(2));
    var c = compute();
    setT('tf-true', c.b.toFixed(3));
    setT('tf-est', c.est.toFixed(3));
    setT('tf-bias', (c.bias >= 0 ? '+' : '') + c.bias.toFixed(3));
    var v = document.getElementById('tf-verdict');
    if (v) { v.textContent = c.correct ? 'identified ✓' : 'biased ✗'; v.style.color = c.correct ? '#34a853' : '#ea4335'; }
    setT('tf-lesson', lesson(c));
    renderBars(c);
    renderDAG(c);
    renderEqs(c);
  }

  function renderBars(c) {
    var W = bars.width, H = bars.height, mT = 24, mB = 38, mL = 46, mR = 12;
    bctx.clearRect(0, 0, W, H);
    var lo = Math.min(-0.4, c.est, c.b) - 0.15;
    var hi = Math.max(2, Math.abs(c.est), c.b) * 1.1;
    function sy(v) { return H - mB - (v - lo) / (hi - lo) * (H - mT - mB); }
    bctx.strokeStyle = '#e8eaed'; bctx.lineWidth = 1;
    bctx.beginPath(); bctx.moveTo(mL, mT); bctx.lineTo(mL, H - mB); bctx.stroke();
    bctx.strokeStyle = '#dadce0';
    bctx.beginPath(); bctx.moveTo(mL, sy(0)); bctx.lineTo(W - mR, sy(0)); bctx.stroke();
    bctx.fillStyle = '#5f6368'; bctx.font = '11px monospace'; bctx.textAlign = 'right';
    bctx.fillText('0', mL - 6, sy(0) + 3);
    var groups = [
      { lab: 'true effect β', col: '#34a853', v: c.b },
      { lab: 'OLS estimate', col: c.correct ? '#34a853' : '#1a73e8', v: c.est }
    ];
    var gw = (W - mL - mR) / 2, bw = 72;
    groups.forEach(function (grp, i) {
      var cx = mL + gw * i + gw / 2, y0 = sy(0), yv = sy(grp.v);
      bctx.fillStyle = grp.col;
      bctx.fillRect(cx - bw / 2, Math.min(yv, y0), bw, Math.abs(yv - y0));
      bctx.fillStyle = '#1f1f1f'; bctx.font = 'bold 13px monospace'; bctx.textAlign = 'center';
      bctx.fillText(grp.v.toFixed(2), cx, grp.v >= 0 ? yv - 5 : yv + 14);
      bctx.fillStyle = '#5f6368'; bctx.font = '13px -apple-system,Arial,sans-serif';
      bctx.fillText(grp.lab, cx, H - mB + 18);
    });
  }

  function arrow(x1, y1, x2, y2, color, blocked, label, lx, ly) {
    if (!dctx) return;
    var ang = Math.atan2(y2 - y1, x2 - x1);
    dctx.strokeStyle = color; dctx.fillStyle = color; dctx.lineWidth = 2;
    dctx.setLineDash(blocked ? [5, 4] : []);
    dctx.beginPath(); dctx.moveTo(x1, y1); dctx.lineTo(x2, y2); dctx.stroke();
    dctx.setLineDash([]);
    dctx.beginPath(); dctx.moveTo(x2, y2);
    dctx.lineTo(x2 - 9 * Math.cos(ang - 0.4), y2 - 9 * Math.sin(ang - 0.4));
    dctx.lineTo(x2 - 9 * Math.cos(ang + 0.4), y2 - 9 * Math.sin(ang + 0.4));
    dctx.closePath(); dctx.fill();
    if (blocked) {
      var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, p = ang + Math.PI / 2, L = 6;
      dctx.strokeStyle = '#202124'; dctx.lineWidth = 2.5;
      dctx.beginPath();
      dctx.moveTo(mx - Math.cos(p) * L, my - Math.sin(p) * L);
      dctx.lineTo(mx + Math.cos(p) * L, my + Math.sin(p) * L);
      dctx.stroke();
    }
    if (label) {
      dctx.fillStyle = color; dctx.font = 'italic 12px Georgia,serif';
      dctx.textAlign = 'center'; dctx.fillText(label, lx, ly);
    }
  }

  function node(x, y, label, boxed, color) {
    if (!dctx) return;
    if (boxed) {
      dctx.strokeStyle = '#202124'; dctx.lineWidth = 2; dctx.setLineDash([3, 2]);
      dctx.strokeRect(x - 26, y - 26, 52, 52); dctx.setLineDash([]);
    }
    dctx.beginPath(); dctx.arc(x, y, 19, 0, 6.2832);
    dctx.fillStyle = '#fff'; dctx.fill();
    dctx.strokeStyle = color; dctx.lineWidth = 2; dctx.stroke();
    dctx.fillStyle = '#202124'; dctx.font = 'italic 14px Georgia,serif';
    dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
    dctx.fillText(label, x, y); dctx.textBaseline = 'alphabetic';
  }

  function renderDAG(c) {
    if (!dctx) return;
    var W = dg.width, H = dg.height;
    dctx.clearRect(0, 0, W, H);
    var RED = '#ea4335', GREEN = '#34a853', GREY = '#9aa0a6';
    var box = c.control;
    arrow(80, 172, 220, 172, GREEN, false, 'β', 150, 164);
    if (c.cse === 'conf') {
      var col = box ? GREY : RED;
      arrow(136, 56, 74, 158, col, box, 'a', 88, 108);
      arrow(164, 56, 226, 158, col, box, 'c', 212, 108);
    } else {
      var col2 = box ? RED : GREY;
      arrow(74, 158, 136, 56, col2, false, 'a', 88, 108);
      arrow(226, 158, 164, 56, col2, false, 'c', 212, 108);
      if (box) {
        dctx.strokeStyle = RED; dctx.setLineDash([4, 4]); dctx.lineWidth = 2;
        dctx.beginPath();
        dctx.moveTo(72, 188); dctx.bezierCurveTo(120, 222, 180, 222, 228, 188);
        dctx.stroke(); dctx.setLineDash([]);
        dctx.fillStyle = RED; dctx.font = 'italic 11px Georgia,serif';
        dctx.textAlign = 'center'; dctx.fillText('spurious', 150, 214);
      }
    }
    node(60, 172, 'F₂', false, '#1a73e8');
    node(240, 172, 'X',   false, '#202124');
    node(150, 44,  'F₁', box, box ? '#202124' : '#1a73e8');
    var cap = document.getElementById('tf-cap');
    if (!cap) return;
    if (c.cse === 'conf') {
      cap.innerHTML = box
        ? '<b style="color:#34a853">Backdoor closed.</b> F₁ (boxed) is controlled, so F₂ ← F₁ → X is blocked and the F₂ loading is identified.'
        : '<b style="color:#ea4335">Open backdoor.</b> F₁ is an uncontrolled common cause of F₂ and X, so the F₂ estimate is biased.';
    } else {
      cap.innerHTML = box
        ? '<b style="color:#ea4335">Collider opened.</b> Conditioning on F₁ (boxed) links F₂ and X spuriously, biasing the estimate.'
        : '<b style="color:#34a853">Collider closed.</b> F₁ is a common effect left out, so no path opens and the F₂ estimate is clean.';
    }
  }

  document.querySelectorAll('input[name="tf-case"]')
    .forEach(function (r) { r.addEventListener('change', draw); });
  document.getElementById('p-ctl').addEventListener('change', draw);
  ['p-b', 'p-a', 'p-c'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', draw);
  });
  draw();
})();
</script>

</body>
</html>
